services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-balqici}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-balqici}
      POSTGRES_DB: ${POSTGRES_DB:-balqici}
    ports:
      - "5432:5432"
    volumes:
      - balqici_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-balqici}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-balqici}:${POSTGRES_PASSWORD:-balqici}@postgres:5432/${POSTGRES_DB:-balqici}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-balqici-secret-key-32chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: "*"
    volumes:
      - balqici_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  balqici_pg:
  balqici_uploads:
